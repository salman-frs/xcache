# Projects that corpus.py measures. Each project is checked out at `rev` and at
# the `commits` first-parent commits before it.
#
# `setup` runs before the steps in every phase, without xcache, the way a CI job
# installs dependencies. `prime` runs once, after the first setup, to fill the
# dependency caches in $HOME that every phase then starts from.
# `steps` are the commands measured under xcache. They are split like a shell
# would split them but not run by a shell.

commits = 6

[ecosystem.go]
setup = ["go mod download"]
env = { GOFLAGS = "-modcacherw", GOTOOLCHAIN = "local" }

[ecosystem.rust]
setup = ["cargo fetch"]
env = { CARGO_INCREMENTAL = "0", CARGO_TERM_COLOR = "never" }

[ecosystem.node]
setup = ["npm ci"]
env = { npm_config_audit = "false", npm_config_fund = "false", npm_config_update_notifier = "false" }

[ecosystem.python]
setup = ["uv sync --locked"]
env = { UV_NO_PROGRESS = "1" }

[ecosystem.gradle]
env = {}

[ecosystem.cmake]
env = { CMAKE_BUILD_PARALLEL_LEVEL = "4", CTEST_PARALLEL_LEVEL = "4" }

