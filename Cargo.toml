[package]
name = "xcache"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/salman-frs/xcache"
description = "Cache for arbitrary commands that finds their inputs by tracing system calls"
keywords = ["cache", "ci", "build", "ptrace"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["rayon"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
nix = { version = "0.31", features = ["ptrace", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
undocumented_unsafe_blocks = "warn"
